<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#000000" />
  <link rel="icon" type="image/png" href="src/favicon.png" />
  <title>404 - 1Leeway</title>
  <script>
    const knownRoutes = /^(?:\/(?:is|work|bio|about|contact))\/?$/i;
    if (knownRoutes.test(window.location.pathname)) {
      const route = encodeURIComponent(window.location.pathname + window.location.search + window.location.hash);
      window.location.replace('/?route=' + route);
    }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    :root {
      color-scheme: dark;
      font-family: 'Courier New', Courier, monospace;
      color: #ffffff;
      background: #000000;
    }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      background: #000000;
    }

    #bg-video {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.58;
      z-index: -2;
    }

    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.42);
      pointer-events: none;
      z-index: -1;
    }

    nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      padding: 20px 32px;
      animation: navReveal 0.7s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    .media-controls { display: flex; align-items: center; }

    .media-controls { gap: 8px; }

    .ctrl-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      padding: 0;
      border: 1px solid rgba(255, 255, 255, 0.5);
      border-radius: 0;
      background: none;
      cursor: pointer;
      opacity: 0.35;
      transition: opacity 0.2s, border-radius 0.3s ease;
    }

    .ctrl-btn:hover { opacity: 0.8; }
    .ctrl-btn.active { border-radius: 50%; opacity: 0.9; }
    .ctrl-btn svg { width: 10px; height: 10px; fill: #ffffff; }

    .music-status {
      max-width: 180px;
      overflow: hidden;
      color: rgba(255, 255, 255, 0.48);
      font-size: 0.65rem;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .nav-links {
      display: flex;
      gap: 20px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .nav-links a {
      color: #ffffff;
      font-size: 0.9rem;
      text-decoration: none;
      transition: opacity 0.2s, transform 0.2s ease;
    }

    .nav-links a:hover { opacity: 0.6; transform: scale(1.12); }

    .page-content {
      position: relative;
      display: flex;
      align-items: center;
      min-height: calc(100vh - 68px);
      padding: 0 80px 0 115px;
    }

    .site-line {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 80px;
      width: 3px;
      background: #ffffff;
      transform-origin: top;
      animation: lineReveal 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.12s both;
    }

    .site-line::before {
      content: '';
      position: absolute;
      top: 0;
      left: 50%;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #ffffff;
      transform: translate(-50%, -50%);
    }

    .error-content {
      display: flex;
      flex-direction: column;
      gap: 14px;
      max-width: 560px;
      animation: reveal 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.18s both;
      transition: opacity 0.35s ease, transform 0.35s cubic-bezier(0.76, 0, 0.24, 1);
    }

    .error-content > * {
      animation: itemReveal 0.55s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    .error-content > :nth-child(1) { animation-delay: 0.34s; }
    .error-content > :nth-child(2) { animation-delay: 0.42s; }
    .error-content > :nth-child(3) { animation-delay: 0.5s; }
    .error-content > :nth-child(4) { animation-delay: 0.58s; }
    .error-content > :nth-child(5) { animation-delay: 0.66s; }

    body.is-leaving .error-content {
      opacity: 0;
      transform: translateY(12px);
    }

    body.is-leaving .site-line {
      transform: scaleY(0);
      transition: transform 0.45s cubic-bezier(0.76, 0, 0.24, 1);
      transform-origin: bottom;
    }

    body.is-leaving nav,
    body.is-leaving .auteur {
      opacity: 0;
      transition: opacity 0.25s ease;
    }

    .error-code {
      margin: 0;
      color: rgba(255, 255, 255, 0.35);
      font-size: 0.78rem;
      letter-spacing: 0.14em;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.6rem, 7vw, 5rem);
      line-height: 1;
      letter-spacing: -0.04em;
    }

    .error-message {
      max-width: 420px;
      margin: 0;
      color: rgba(255, 255, 255, 0.7);
      font-size: 0.95rem;
      line-height: 1.8;
    }

    .error-path {
      overflow: hidden;
      max-width: 100%;
      color: rgba(255, 255, 255, 0.32);
      font-size: 0.72rem;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .home-link {
      align-self: flex-start;
      margin-top: 8px;
      padding: 9px 16px;
      border: 1px solid rgba(255, 255, 255, 0.35);
      color: #ffffff;
      font-size: 0.8rem;
      text-decoration: none;
      transition: border-color 0.2s, background 0.2s;
    }

    .home-link:hover {
      border-color: #ffffff;
      background: rgba(255, 255, 255, 0.12);
    }

    .auteur {
      position: fixed;
      right: 32px;
      bottom: 24px;
      color: #ffffff;
      font-size: 0.78rem;
      letter-spacing: 0.08em;
      opacity: 0.3;
      text-decoration: none;
      transition: opacity 0.2s;
    }

    .auteur:hover { opacity: 0.8; }

    @keyframes reveal {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes itemReveal {
      from { opacity: 0; transform: translateX(-10px); }
      to { opacity: 1; transform: translateX(0); }
    }

    @keyframes navReveal {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes lineReveal {
      from { transform: scaleY(0); }
      to { transform: scaleY(1); }
    }

    @media (max-width: 640px) {
      nav { align-items: flex-start; padding: 18px 20px; }
      .nav-links { gap: 11px; flex-wrap: wrap; justify-content: flex-end; }
      .nav-links a { font-size: 0.72rem; }
      .page-content { min-height: calc(100vh - 76px); padding: 0 28px 0 58px; }
      .site-line { left: 34px; }
      h1 { font-size: 3.2rem; }
      .auteur { right: 20px; bottom: 18px; font-size: 0.65rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      nav, .site-line, .error-content, .error-content > * { animation: none; }
      .error-content { transition: none; }
      body.is-leaving .error-content { opacity: 0; transform: none; }
      #bg-video { display: none; }
    }
  </style>
</head>
<body>
  <video id="bg-video" src="src/Background.mp4" autoplay loop muted playsinline></video>

  <nav aria-label="Main navigation">
    <div class="media-controls">
      <button class="ctrl-btn active" id="btn-video" type="button" title="Background on/off" aria-label="Toggle background">
        <svg id="icon-video" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="3" width="4" height="18"/><rect x="15" y="3" width="4" height="18"/></svg>
      </button>
      <button class="ctrl-btn" id="btn-music" type="button" title="Play music" aria-label="Play music">
        <svg id="icon-music" viewBox="0 0 24 24" aria-hidden="true"><polygon points="5,3 19,12 5,21"/></svg>
      </button>
      <span class="music-status" id="music-status" aria-live="polite">music off</span>
    </div>
    <ul class="nav-links">
      <li><a href="./#is">.is()</a></li>
      <li><a href="./#work">.work()</a></li>
      <li><a href="./#bio">.bio()</a></li>
      <li><a href="./#about">.about()</a></li>
      <li><a href="./#contact">.contact()</a></li>
    </ul>
  </nav>

  <main class="page-content">
    <div class="site-line" aria-hidden="true"></div>
    <section class="error-content" aria-labelledby="error-title">
      <p class="error-code">// ERROR 404</p>
      <h1 id="error-title">Page not found.</h1>
      <p class="error-message">This route does not exist in the current build. The page may have moved, or the address may be incomplete.</p>
      <div class="error-path" id="error-path" aria-label="Requested path"></div>
      <a class="home-link" href="./#is">— return to .is() —</a>
    </section>
  </main>

  <a class="auteur" href="https://pixabay.com/users/traphitho-3244107/" target="_blank" rel="noopener noreferrer">.TRAPHITHO</a>

  <script>
    const video = document.getElementById('bg-video');
    const videoButton = document.getElementById('btn-video');
    const videoIcon = document.getElementById('icon-video');
    const music = new Audio('msc/lofi.mp3');
    const musicButton = document.getElementById('btn-music');
    const musicIcon = document.getElementById('icon-music');
    const musicStatus = document.getElementById('music-status');
    const errorPath = document.getElementById('error-path');

    music.loop = true;
    music.volume = 0.65;

    errorPath.textContent = window.location.pathname + window.location.search;

    function setMusicState(playing, message) {
      musicIcon.innerHTML = playing
        ? '<rect x="5" y="3" width="4" height="18"/><rect x="15" y="3" width="4" height="18"/>'
        : '<polygon points="5,3 19,12 5,21"/>';
      musicButton.classList.toggle('active', playing);
      musicButton.title = playing ? 'Pause music' : 'Play music';
      musicButton.setAttribute('aria-label', musicButton.title);
      musicStatus.textContent = message || (playing ? 'playing: lofi' : 'music off');
    }

    videoButton.addEventListener('click', () => {
      if (video.paused) {
        video.play().catch(() => {});
        videoButton.classList.add('active');
        videoIcon.innerHTML = '<rect x="5" y="3" width="4" height="18"/><rect x="15" y="3" width="4" height="18"/>';
      } else {
        video.pause();
        videoButton.classList.remove('active');
        videoIcon.innerHTML = '<polygon points="5,3 19,12 5,21"/>';
      }
    });

    musicButton.addEventListener('click', () => {
      if (music.paused) {
        music.play()
          .then(() => setMusicState(true))
          .catch(() => setMusicState(false, 'music unavailable'));
      } else {
        music.pause();
        setMusicState(false);
      }
    });

    music.addEventListener('error', () => setMusicState(false, 'music unavailable'));

    document.querySelectorAll('a[href^="./#"]').forEach(link => {
      link.addEventListener('click', event => {
        if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

        event.preventDefault();
        document.body.classList.add('is-leaving');
        setTimeout(() => { window.location.href = link.href; }, 380);
      });
    });
  </script>
</body>
</html>
